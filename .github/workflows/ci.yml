name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test suite
    runs-on: ubuntu-latest
    # Integration tests start real Postgres/Redis containers via Testcontainers,
    # so a hung container pull should fail the run rather than burn the default
    # 6-hour job limit.
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      # pom.xml pins <java.version>25</java.version> with no toolchain config,
      # so the JDK running Maven must itself be 25. Zulu matches the JDK used
      # locally.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'zulu'
          cache: maven

      # No `services:` block on purpose: the integration tests provision their
      # own Postgres and Redis through Testcontainers @ServiceConnection and
      # would ignore any containers declared here. Docker is preinstalled on
      # ubuntu-latest, which is all Testcontainers needs.
      - name: Run tests
        run: ./mvnw --batch-mode test

      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7
