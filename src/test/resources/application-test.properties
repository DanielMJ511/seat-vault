# Minimal marker profile so @ActiveProfiles("test") is a recognized profile.
# No property overrides needed: JwtProperties already permits the default
# dev-only secret under the "dev" or "test" profile.

# HikariCP defaults to a 10-connection pool. EventSeatRepository#findByIdForUpdate
# takes a Postgres row lock with no lock timeout, so a thread blocked on that
# lock holds its connection for the whole wait. Concurrency integration tests
# (e.g. NoOversellIntegrationTest) race 20 threads at once; with only 10
# connections available, most threads would starve waiting on the pool itself
# rather than the row lock under test, and Hikari's 30s connection-acquisition
# timeout would surface as a spurious 500 - a false defect this suite is meant
# to catch, not cause. Raise the pool so every racing thread gets its own
# connection.
spring.datasource.hikari.maximum-pool-size=30

# Disables HoldSweepService's 30-second timer (see config/SchedulingConfig.java)
# for every context started under this profile. Several integration test
# classes share one Spring context (identical @SpringBootTest annotation
# sets get one MergedContextConfiguration cache key) and commit real,
# multi-seat holds outside a rolled-back transaction; a live timer racing
# those commits could reclaim a hold mid-assertion. Per ADR-0002 the sweep is
# UX-only reconciliation, not correctness-critical, so no test loses coverage
# by disabling the timer - tests that need sweepExpiredHolds() to run call it
# directly (HoldSweepService remains an ordinary injectable bean).
seatvault.sweep.scheduling.enabled=false
