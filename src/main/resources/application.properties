spring.application.name=seat-vault

# --- Datasource (PostgreSQL) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/seatvault}
spring.datasource.username=${DB_USER:seatvault}
spring.datasource.password=${DB_PASSWORD:seatvault}

# --- JPA / Hibernate ---
# Schema is owned by Flyway migrations only. Never use update/create here.
spring.jpa.hibernate.ddl-auto=validate

# --- Flyway ---
# Schema-only by default (safe for any environment, including prod).
# Seed data lives in db/seed and is opted into per-environment (see
# application-dev.properties) so demo accounts never land outside dev/test.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Redis ---
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# --- JWT ---
# 10-minute default is deliberate, not arbitrary: tokens are stateless and
# non-revocable (see ADR-0005), so a short lifetime is the only mitigation
# against a compromised token or a stale token surviving a password reset.
security.jwt.secret=${JWT_SECRET:change-me-in-prod-please-this-is-a-dev-only-default-secret-value}
security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:10}

# --- Hold ---
hold.ttl-minutes=${HOLD_TTL_MINUTES:5}
hold.max-seats-per-hold=${HOLD_MAX_SEATS_PER_HOLD:8}
# Redis contention-lock TTL: independent of hold.ttl-minutes above. Must
# comfortably cover the worst-case create-hold transaction (up to
# max-seats-per-hold sequential row locks plus surrounding Redis round trips),
# or a legitimate in-flight request can lose its lock and cause a false
# fail-fast rejection for a competing request on a different seat.
hold.redis-lock-ttl-seconds=${HOLD_REDIS_LOCK_TTL_SECONDS:10}

# --- OpenAPI / Swagger UI (defaults, listed explicitly for clarity) ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# --- Actuator (see ADR-0012) ---
# Explicit allowlist, never `*`: exposure and authorization are two separate
# levers (SecurityConfig grants permitAll only to the health group paths, and
# /actuator/metrics is exposed here but reachable only when authenticated,
# because it carries no matcher at all in SecurityConfig).
management.endpoints.web.exposure.include=health,metrics
# show-components=always gives an authenticated operator per-indicator
# visibility on the parent aggregate (including Redis's true state, which is
# never visible to an anonymous caller - see below) and, once the groups
# below exist, lets an anonymous caller distinguish readinessState from db
# within the readiness group rather than collapsing both into one status.
# show-details stays restricted so the detail payloads (database engine,
# Redis version, filesystem paths) are never published to anyone anonymous.
management.endpoint.health.show-components=always
management.endpoint.health.show-details=when-authorized
# Readiness group composition (ADR-0013): Postgres is the concurrency
# authority (ADR-0001) so its indicator is fatal to readiness; Redis is a
# non-authoritative fail-fast optimization layer only, so it is deliberately
# absent here - Redis being down must never pull a functional instance out of
# rotation. The parent /actuator/health aggregate (authenticated, see
# SecurityConfig) still carries the Redis indicator and reports DOWN honestly
# when Redis is unreachable; nothing here suppresses or misreports it, this
# only controls what the readiness PROBE is composed from.
# management.endpoint.health.validate-group-membership defaults to true, so a
# typo'd member name below fails fast at startup rather than being silently
# dropped.
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.liveness.include=livenessState
