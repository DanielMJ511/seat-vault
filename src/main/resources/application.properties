spring.application.name=seat-vault

# --- Datasource (PostgreSQL) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/seatvault}
spring.datasource.username=${DB_USER:seatvault}
spring.datasource.password=${DB_PASSWORD:seatvault}

# --- JPA / Hibernate ---
# Schema is owned by Flyway migrations only. Never use update/create here.
spring.jpa.hibernate.ddl-auto=validate

# --- Flyway ---
spring.flyway.enabled=true

# --- Redis ---
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# --- JWT (config only; JwtService implementation lands in a later milestone) ---
security.jwt.secret=${JWT_SECRET:change-me-in-prod-please-this-is-a-dev-only-default-secret-value}
security.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# --- OpenAPI / Swagger UI (defaults, listed explicitly for clarity) ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
